[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextpulse-knowledge"
version = "0.1.0"
description = "Local bi-temporal fused knowledge-graph spine for ContextPulse (Phase 1)"
authors = [
    { name = "David Jerard", email = "david@jerardventures.com" },
]
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # contextpulse-memory is NOT a PyPI package -- it is a sibling workspace
    # member (packages/memory). It resolves locally only when installed in the
    # same pip invocation as packages/memory (see CI's WORKSPACE_PACKAGES, or
    # root pyproject.toml's [tool.setuptools.packages.find].where, which vendors
    # both packages/memory/src and packages/knowledge/src into one distribution).
    # A standalone `pip install -e packages/knowledge` will fail to resolve this
    # name on PyPI -- that is intentional fail-closed behavior, not a bug.
    "contextpulse-memory",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextpulse_knowledge = ["schema.sql"]
