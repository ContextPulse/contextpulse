version: 2

updates:
  # ---------------------------------------------------------------------
  # Python dependencies
  #
  # versioning-strategy: widen
  #   ContextPulse is an installable library, not an application. The pip
  #   default ("auto") raises the MINIMUM of a range, which narrows who can
  #   install us without protecting us from anything -- the upper bound is
  #   what guards against a breaking major, and those are already declared
  #   (numpy<3, psutil<8, mcp<2). On 2026-09-19 that default produced five
  #   PRs in one batch that did nothing but lift floors; all five were
  #   closed on policy. "widen" extends the allowed range instead, so an
  #   upstream release makes us MORE installable rather than less.
  #   Security advisories still open PRs regardless of this setting.
  #
  # directories
  #   "/" alone left every packages/*/pyproject.toml unmonitored -- eight
  #   manifests carrying real pins, invisible to Dependabot, so a published
  #   advisory against one of them would never have raised a PR. The glob
  #   covers them and any package added later.
  # ---------------------------------------------------------------------
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    versioning-strategy: widen
    open-pull-requests-limit: 5
    groups:
      # One PR per batch instead of one per manifest. Without this, a shared
      # dependency bumped across the workspace opens a near-identical PR for
      # each of the nine manifests above.
      python-dev-dependencies:
        dependency-type: "development"
      python-runtime-dependencies:
        dependency-type: "production"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
