name: Release

# Builds every workspace package on a version tag and attaches the wheels and
# sdists to the GitHub release for that tag. GitHub Releases is the only
# distribution channel: the PyPI project name `contextpulse` belongs to an
# unrelated project (registered 2026-03-28 by a different author), so the
# former PyPI publish step could never succeed and was removed after the
# v0.1.1 run failed with `invalid-publisher`. If PyPI ever becomes a channel
# it will be under the `contextpulse-*` distribution names, each of which
# needs its own trusted publisher registered on pypi.org before a publish
# step is added back.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build-and-attach:
    needs: [security]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for attaching files to the GitHub release

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build all packages
        run: |
          set -e
          for pkg in packages/core packages/screen packages/voice packages/touch packages/project packages/memory packages/knowledge; do
            echo "Building $pkg..."
            python -m build "$pkg" --outdir dist/
          done

      - name: Check distributions
        run: twine check dist/*

      - name: Attach distributions to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
