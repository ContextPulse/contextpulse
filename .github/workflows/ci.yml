name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Single source of truth for "install the whole testable workspace", reused
  # by every job below instead of four hand-maintained lists that drift apart
  # (root cause of the 2026-09-19 CI break: two jobs silently omitted packages
  # whose modules packages/core/tests imports/patches -- contextpulse_sight and
  # contextpulse_knowledge -- and every test file importing them errored at
  # collection). packages/agent is deliberately excluded (its own job is out
  # of scope here); packages/meeting is a pre-existing, separately-tracked gap
  # (cp-meeting-package-missing-from-ci) -- not fixed in this change.
  WORKSPACE_PACKAGES: >-
    -e packages/core -e packages/screen -e packages/voice -e packages/touch
    -e packages/memory -e packages/project -e packages/knowledge
  # Same list minus packages/core, for the one job (macos) that needs the
  # core[macos] extra instead of plain core -- keeps that one substitution
  # local without forking the whole list a second time.
  WORKSPACE_PACKAGES_NO_CORE: >-
    -e packages/screen -e packages/voice -e packages/touch
    -e packages/memory -e packages/project -e packages/knowledge

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint all packages
        run: |
          ruff check packages/core/src packages/memory/src packages/project/src packages/screen/src packages/voice/src packages/touch/src packages/knowledge/src

  test-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cross-platform packages
        # Full workspace install even though this job only RUNS core/memory/project
        # tests below: packages/core/tests/test_daemon.py imports/patches
        # contextpulse_sight and contextpulse_knowledge to exercise the daemon's
        # optional-module integration points, so both must be resolvable at
        # collection time even though their own test suites don't run here.
        run: |
          pip install ${{ env.WORKSPACE_PACKAGES }}
          pip install pytest pytest-timeout

      - name: Run cross-platform tests
        run: |
          python -m pytest packages/core/tests packages/memory/tests packages/project/tests -v --tb=short

  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all packages
        run: |
          pip install ${{ env.WORKSPACE_PACKAGES }}
          pip install pytest pytest-timeout

      - name: Run all tests
        run: |
          python -m pytest packages/ -v --tb=short --ignore=packages/agent

  test-integration:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all packages + test deps
        run: |
          pip install ${{ env.WORKSPACE_PACKAGES }}
          pip install pytest pytest-cov pytest-timeout pytest-threadleak hypothesis

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short -m "integration or not integration" --timeout=60

      - name: Run property tests
        shell: bash
        run: |
          set +e
          python -m pytest packages/ -v --tb=short -m property --timeout=120
          exit_code=$?
          set -e
          if [ $exit_code -eq 5 ]; then
            echo "No property tests collected — OK"
            exit 0
          fi
          exit $exit_code

  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages with macOS extras
        run: |
          pip install -e "packages/core[macos]" ${{ env.WORKSPACE_PACKAGES_NO_CORE }}
          pip install pytest pytest-timeout

      - name: Run tests (skip Windows-only)
        run: |
          python -m pytest packages/ -v --tb=short --ignore=packages/agent -k "not windows"
